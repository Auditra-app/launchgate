name: LaunchGate Preflight CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  preflight-audit:
    name: Production Preflight Audit & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit test suite
        run: npm test

      - name: Execute LaunchGate self-preflight scan
        run: node cli.js scan --fail-on-p0 --fail-on-p1
